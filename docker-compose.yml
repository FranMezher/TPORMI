version: "3.8"

services:

  # ----------------------------------------------------------
  # MongoDB (una instancia, dos bases lógicas):
  #   · flowops_procesos   → definiciones de procesos + tenants
  #   · flowops_instancias → instancias + tareas
  # Puerto 27018 (evita el conflicto con el Mongo nativo del 27017)
  # ----------------------------------------------------------
  instancias:
    image: mongo:7
    container_name: flowops-instancias
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: flowops123
      MONGO_INITDB_DATABASE: flowops_instancias
    volumes:
      - instancias:/data/db
    networks:
      - flowops-net

  # ----------------------------
  # admin web de MongoDB
  # ----------------------------
  mongo-express:
    image: mongo-express:1.0.2
    container_name: flowops-mongo-express
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://admin:flowops123@flowops-instancias:27017/?authSource=admin
      ME_CONFIG_BASICAUTH: "false"
      ME_CONFIG_MONGODB_ENABLE_ADMIN: "true"
    depends_on:
      - instancias
    networks:
      - flowops-net

  # ----------------------------
  # eventos y auditoria
  # ----------------------------
  auditoria:
    image: cassandra:4
    container_name: flowops-auditoria
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: flowops-cluster
      CASSANDRA_DC: datacenter1
    volumes:
      - auditoria:/var/lib/cassandra
    networks:
      - flowops-net

  # ----------------------------
  # cache y sesiones
  # ----------------------------
  cache:
    image: redis:7-alpine
    container_name: flowops-cache
    ports:
      - "6379:6379"
    volumes:
      - cache:/data
    networks:
      - flowops-net

  # ----------------------------
  # busqueda full-text
  # ----------------------------
  busqueda:
    image: elasticsearch:8.13.0
    container_name: flowops-busqueda
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - busqueda:/usr/share/elasticsearch/data
    networks:
      - flowops-net

  # ----------------------------
  # grafo de flujo y dependencias
  # ----------------------------
  grafo:
    image: neo4j:5-community
    container_name: flowops-grafo
    ports:
      - "7474:7474"   # Neo4j Browser
      - "7687:7687"   # Bolt protocol
    environment:
      NEO4J_AUTH: neo4j/flowops123
    volumes:
      - grafo:/data
    networks:
      - flowops-net

volumes:
  instancias:
  auditoria:
  cache:
  busqueda:
  grafo:

networks:
  flowops-net:
    driver: bridge
